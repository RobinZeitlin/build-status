<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Build Status</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #21262d;
      --text: #e6edf3;
      --muted: #8b949e;
      --ok: #3fb950;
      --fail: #f85149;
      --run: #d29922;
      --off: #6e7681;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header h1 { margin: 0; font-size: clamp(18px, 4.5vw, 26px); font-weight: 600; color: var(--muted); }
    #headerRight { display: flex; align-items: center; gap: 12px; }
    #updated { font-size: 14px; color: var(--muted); white-space: nowrap; }
    #settingsBtn {
      font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    }

    /* Repo cards */
    #boards { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 900px) { #boards.multi { grid-template-columns: 1fr 1fr; } }

    .card {
      border-radius: 16px;
      background: var(--panel);
      border: 2px solid var(--line);
      overflow: hidden;
    }
    .card.ok   { border-color: var(--ok); }
    .card.fail { border-color: var(--fail); }
    .card.run  { border-color: var(--run); }

    .hero { display: flex; align-items: center; gap: clamp(14px, 4vw, 28px); padding: clamp(16px, 4vw, 28px); }
    .hero .dot { width: clamp(44px, 11vw, 80px); height: clamp(44px, 11vw, 80px); }
    .single .hero .dot { width: clamp(56px, 14vw, 96px); height: clamp(56px, 14vw, 96px); }
    .heroText { min-width: 0; flex: 1; }
    .repoName {
      font-size: clamp(14px, 3.5vw, 18px); color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .repoName b { color: var(--text); }
    .state { font-size: clamp(30px, 8vw, 52px); font-weight: 700; line-height: 1.05; margin-top: 2px; }
    .single .state { font-size: clamp(36px, 10vw, 72px); }
    .card.ok .state   { color: var(--ok); }
    .card.fail .state { color: var(--fail); }
    .card.run .state  { color: var(--run); }
    .heroTitle {
      margin-top: 6px; font-size: clamp(16px, 4vw, 22px);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .heroMeta { margin-top: 4px; font-size: clamp(13px, 3.2vw, 17px); color: var(--muted);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cardMsg { padding: 0 clamp(16px, 4vw, 28px) 16px; font-size: 15px; color: var(--muted); }
    .cardMsg.error { color: var(--fail); }

    /* Run list */
    ul { list-style: none; margin: 0; padding: 0 clamp(12px, 3vw, 20px) 4px; border-top: 1px solid var(--line); }
    li {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
      padding: 12px 4px; border-bottom: 1px solid var(--line);
    }
    li:last-child { border-bottom: none; }
    li a { color: inherit; text-decoration: none; min-width: 0; }
    .title { font-size: clamp(15px, 3.8vw, 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { font-size: clamp(12px, 3vw, 15px); color: var(--muted); margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .branch {
      display: inline-block; padding: 0 6px; border-radius: 6px;
      background: #1f6feb33; color: #79c0ff; font-family: ui-monospace, Consolas, monospace;
    }
    .ago { font-size: clamp(12px, 3vw, 15px); color: var(--muted); text-align: right; white-space: nowrap; }

    /* Status dots */
    .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--off); flex: none; }
    .dot.ok   { background: var(--ok); }
    .dot.fail { background: var(--fail); }
    .dot.run  { background: var(--run); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.85); } }

    /* Settings */
    #setup {
      display: none; flex-direction: column; gap: 10px;
      padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
    }
    #setup.show { display: flex; }
    #setup label { font-size: 14px; color: var(--muted); }
    #setup textarea, #setup input {
      font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%;
    }
    #setup textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 15px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    #setup button {
      font-size: 17px; padding: 12px 20px; border-radius: 10px; border: none;
      background: #238636; color: white; font-weight: 600; cursor: pointer;
    }
    #setup button.secondary { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .hint { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }

    #message { padding: 16px; border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 16px; }
    #message.error { color: var(--fail); }
    footer { margin-top: auto; font-size: 13px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Builds</h1>
    <div id="headerRight">
      <span id="updated"></span>
      <button id="settingsBtn" type="button">Settings</button>
    </div>
  </header>

  <form id="setup">
    <label for="reposInput">Repositories to watch, one per line (owner/repository)</label>
    <textarea id="reposInput" autocapitalize="off" autocomplete="off" spellcheck="false"
              placeholder="RobinZeitlin/my-game&#10;RobinZeitlin/another-repo"></textarea>
    <label for="tokenInput">Access token (only needed for private repositories)</label>
    <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="Access token">
    <div class="row">
      <button type="submit">Save</button>
      <button type="button" id="forgetToken" class="secondary" hidden>Forget token</button>
      <button type="button" id="cancelSetup" class="secondary">Cancel</button>
    </div>
    <p class="hint">Everything here is saved only in this browser on this device. One fine-grained token can cover
      several repositories: select them all and give it read-only <b>Actions</b> access.
      Leave the token field empty to keep the saved one.</p>
  </form>

  <div id="message" hidden></div>

  <main id="boards"></main>

  <footer id="footer"></footer>

  <script>
    // ---- Settings -------------------------------------------------------
    // Repositories come from ?repos=a/b,c/d (or ?repo=a/b), else the list saved on this device.
    // The access token is only ever kept in this browser's storage — never in the URL or this file.
    const $ = (id) => document.getElementById(id);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
      remove(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
    };

    const REPO_RE = /^[\w.-]+\/[\w.-]+$/;

    function parseRepos(text) {
      return [...new Set((text || '')
        .split(/[\s,]+/)
        .map((s) => s.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, ''))
        .filter(Boolean))];
    }

    function loadRepos() {
      const params = new URLSearchParams(location.search);
      const fromUrl = params.get('repos') || params.get('repo');
      if (fromUrl) return parseRepos(fromUrl);
      try {
        const saved = JSON.parse(store.get('status.repos') || 'null');
        if (Array.isArray(saved)) return saved;
      } catch { /* fall through */ }
      const legacy = store.get('status.repo'); // single-repo version of this page
      return legacy ? [legacy] : [];
    }

    let repos = loadRepos();
    let token = store.get('status.token') || '';
    const state = {};        // repo -> { runs, error, info }
    let lastUpdate = null;
    let rateRemaining = null;
    let timer = null;

    // Stay well under GitHub's limits: 60 requests/hour without a token, 5000 with one.
    function pollSeconds() {
      return token ? Math.max(60, repos.length * 15) : Math.max(120, repos.length * 70);
    }

    // ---- Helpers --------------------------------------------------------
    function classify(run) {
      if (run.status !== 'completed') return { cls: 'run', label: 'Running' };
      switch (run.conclusion) {
        case 'success':         return { cls: 'ok',   label: 'Passing' };
        case 'failure':
        case 'timed_out':
        case 'startup_failure': return { cls: 'fail', label: 'Failed' };
        case 'cancelled':       return { cls: '',     label: 'Cancelled' };
        default:                return { cls: '',     label: run.conclusion || 'Done' };
      }
    }

    function ago(iso) {
      const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 45)    return 'just now';
      if (s < 3600)  return Math.round(s / 60) + ' min ago';
      if (s < 86400) return Math.round(s / 3600) + ' h ago';
      return Math.round(s / 86400) + ' d ago';
    }

    function duration(run) {
      const start = new Date(run.run_started_at || run.created_at).getTime();
      const end   = run.status === 'completed' ? new Date(run.updated_at).getTime() : Date.now();
      const s = Math.max(0, Math.round((end - start) / 1000));
      return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
    }

    const firstLine = (t) => (t || '').split('\n')[0];
    const runTitle = (run) => run.display_title || firstLine(run.head_commit && run.head_commit.message);

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function showMessage(text, isError) {
      const m = $('message');
      m.hidden = !text;
      m.textContent = text || '';
      m.className = isError ? 'error' : '';
    }

    // ---- Rendering ------------------------------------------------------
    function renderCard(repo, listLength) {
      const s = state[repo] || {};
      const runs = s.runs || [];
      const latest = runs[0];
      const c = latest ? classify(latest) : { cls: '', label: s.error ? 'Error' : '…' };

      const card = el('section', 'card ' + c.cls);
      const hero = el('div', 'hero');
      hero.append(el('div', 'dot ' + c.cls));
      const text = el('div', 'heroText');

      const [owner, name] = repo.split('/');
      const repoName = el('div', 'repoName');
      repoName.append(document.createTextNode(owner + ' / '), el('b', null, name));
      text.append(repoName, el('div', 'state', c.label));

      if (latest) {
        text.append(el('div', 'heroTitle', runTitle(latest)));
        text.append(el('div', 'heroMeta', `${latest.name} · ${latest.head_branch} · ${ago(latest.created_at)} · ${duration(latest)}`));
      }
      hero.append(text);
      card.append(hero);

      if (s.error || s.info) card.append(el('div', 'cardMsg' + (s.error ? ' error' : ''), s.error || s.info));

      const rest = runs.slice(1, 1 + listLength);
      if (rest.length) {
        const ul = el('ul');
        for (const run of rest) {
          const k = classify(run);
          const li = el('li');
          li.append(el('div', 'dot ' + k.cls));
          const a = el('a');
          a.href = run.html_url; a.target = '_blank'; a.rel = 'noopener';
          a.append(el('div', 'title', runTitle(run)));
          const meta = el('div', 'meta');
          meta.append(el('span', 'branch', run.head_branch), document.createTextNode(`  ${run.name} · #${run.run_number}`));
          a.append(meta);
          li.append(a);
          const right = el('div', 'ago');
          right.append(document.createTextNode(ago(run.created_at)), el('br'), document.createTextNode(duration(run)));
          li.append(right);
          ul.append(li);
        }
        card.append(ul);
      }
      return card;
    }

    function render() {
      $('updated').textContent = lastUpdate ? 'updated ' + ago(lastUpdate.toISOString()) : '';
      const boards = $('boards');
      boards.className = repos.length > 1 ? 'multi' : 'single';
      // One repo: show a long history. Several: keep each card short.
      const listLength = repos.length === 1 ? 7 : repos.length === 2 ? 4 : 2;
      boards.replaceChildren(...repos.map((r) => renderCard(r, listLength)));
      $('footer').textContent = (token ? 'Signed in with token · ' : '')
        + (rateRemaining != null ? `GitHub API: ${rateRemaining} requests left this hour` : '');
    }

    // ---- Data -----------------------------------------------------------
    async function fetchRepo(repo) {
      const s = (state[repo] = state[repo] || { runs: [] });
      try {
        const headers = { Accept: 'application/vnd.github+json' };
        if (token) headers.Authorization = 'Bearer ' + token;
        const res = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=8`, { headers });
        const remaining = res.headers.get('x-ratelimit-remaining');
        const reset = res.headers.get('x-ratelimit-reset');
        if (remaining != null) rateRemaining = remaining;
        s.error = s.info = '';

        if (res.status === 401) {
          s.error = 'GitHub rejected the access token (expired or revoked?). Open Settings to enter a new one.';
          s.runs = [];
        } else if (res.status === 404) {
          s.error = token
            ? "Can't see this repository. Check the name, and that the token includes it with Actions read access."
            : "Can't find this repository. If it's private, add an access token in Settings.";
          s.runs = [];
        } else if (res.status === 403 && remaining !== '0') {
          s.error = "The token doesn't have permission to read Actions for this repository.";
          s.runs = [];
        } else if (res.status === 403 || res.status === 429) {
          const when = reset ? new Date(reset * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'later';
          s.error = `GitHub rate limit reached — works again around ${when}.`;
        } else if (!res.ok) {
          s.error = `GitHub returned ${res.status}. Retrying shortly.`;
        } else {
          const data = await res.json();
          s.runs = data.workflow_runs || [];
          if (!s.runs.length) s.info = 'No workflow runs yet. Push a commit to start one.';
        }
      } catch {
        s.error = 'Offline or GitHub unreachable. Retrying…';
      }
    }

    async function refresh() {
      if (!repos.length) return;
      await Promise.all(repos.map(fetchRepo));
      lastUpdate = new Date();
      render();
    }

    function start() {
      clearInterval(timer);
      if (!repos.length) {
        openSettings();
        showMessage('Add one or more GitHub repositories to watch.');
        render();
        return;
      }
      showMessage('');
      store.set('status.repos', JSON.stringify(repos));
      store.remove('status.repo');
      render();
      refresh();
      timer = setInterval(refresh, pollSeconds() * 1000);
    }

    // ---- Settings UI ----------------------------------------------------
    function openSettings() {
      $('reposInput').value = repos.join('\n');
      $('tokenInput').value = '';
      $('tokenInput').placeholder = token ? 'Token saved — leave empty to keep it' : 'Access token';
      $('forgetToken').hidden = !token;
      $('cancelSetup').hidden = !repos.length;
      $('setup').classList.add('show');
    }
    const closeSettings = () => $('setup').classList.remove('show');

    $('settingsBtn').addEventListener('click', () =>
      $('setup').classList.contains('show') ? closeSettings() : openSettings());
    $('cancelSetup').addEventListener('click', closeSettings);

    $('forgetToken').addEventListener('click', () => {
      token = '';
      store.remove('status.token');
      $('forgetToken').hidden = true;
      $('tokenInput').placeholder = 'Access token';
    });

    $('setup').addEventListener('submit', (e) => {
      e.preventDefault();
      const list = parseRepos($('reposInput').value);
      const bad = list.filter((r) => !REPO_RE.test(r));
      if (bad.length) { showMessage(`Not in owner/repository form: ${bad.join(', ')}`, true); return; }
      if (!list.length) { showMessage('Add at least one repository.', true); return; }

      const newToken = $('tokenInput').value.trim();
      if (newToken) { token = newToken; store.set('status.token', token); }
      $('tokenInput').value = '';

      repos = list;
      for (const k of Object.keys(state)) if (!repos.includes(k)) delete state[k];
      closeSettings();
      start();
    });

    // ---- Display niceties -----------------------------------------------
    // Double-tap anywhere (outside the settings) toggles fullscreen — works in a normal Chrome tab too
    document.addEventListener('dblclick', (e) => {
      if (e.target.closest('form, a, button')) return;
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    });

    // Keep "x min ago" and running durations fresh between polls
    setInterval(render, 15000);

    // Refresh straight away when the screen comes back on
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { refresh(); requestWakeLock(); }
    });

    // Ask the phone to keep the screen on (only works on https or localhost)
    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch { /* not allowed */ }
    }
    requestWakeLock();

    start();
  </script>
</body>
</html>
